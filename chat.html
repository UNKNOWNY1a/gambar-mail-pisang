<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room Rahsia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            color: #4ade80;
            margin-bottom: 10px;
        }
        #chat-box {
            flex: 1;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            background-color: #1a1a1a;
            margin-bottom: 10px;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.saya {
            background-color: #2563eb;
            align-self: flex-end;
            margin-left: auto;
        }
        .message.orang-lain {
            background-color: #374151;
            align-self: flex-start;
            margin-right: auto;
        }
        .nama {
            font-size: 10px;
            color: #9ca3af;
            margin-bottom: 2px;
            display: block;
        }
        #input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #222;
            color: white;
            outline: none;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background-color: #4ade80;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background-color: #22c55e;
        }
    </style>
</head>
<body>

    <h1>💬 Chat Room Rahsia</h1>
    
    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="mesej-input" placeholder="Taip mesej..." autocomplete="off">
        <button onclick="hantarMesej()">Hantar</button>
    </div>

    <script>
        // Jana nama rawak untuk user ni (contoh: User-123)
        let namaSaya = localStorage.getItem('namaChat');
        if (!namaSaya) {
            namaSaya = "User-" + Math.floor(Math.random() * 1000);
            localStorage.setItem('namaChat', namaSaya);
        }

        // Setup BroadcastChannel untuk komunikasi antara tab
        const channel = new BroadcastChannel('chat-room');

        // Ambil elemen HTML
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('mesej-input');

        // Fungsi untuk paparkan mesej dalam skrin
        function paparMesej(teks, penghantar) {
            const div = document.createElement('div');
            div.className = 'message ' + (penghantar === namaSaya ? 'saya' : 'orang-lain');
            
            div.innerHTML = `
                <span class="nama">${penghantar === namaSaya ? 'Anda' : penghantar}</span>
                ${teks}
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto scroll ke bawah
        }

        // Fungsi bila butang Hantar ditekan
        function hantarMesej() {
            const teks = input.value.trim();
            if (teks === "") return;

            // 1. Papar mesej kita sendiri
            paparMesej(teks, namaSaya);

            // 2. Hantar mesej ke tab lain (BroadcastChannel)
            channel.postMessage({
                teks: teks,
                penghantar: namaSaya
            });

            // 3. Kosongkan kotak input
            input.value = "";
        }

        // Dengar mesej dari tab lain
        channel.onmessage = (event) => {
            paparMesej(event.data.teks, event.data.penghantar);
        };

        // Boleh tekan 'Enter' untuk hantar
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                hantarMesej();
            }
        });
    </script>
</body>
  </html>
